# Rust application variant in the hyperi-ci test matrix. Mirrors real
# DFE projects (native deps via librdkafka, aarch64 cross-compile,
# hyperi-rustlib dep) without any cargo registry dependencies that
# would make the build slow. Total CI <5min by design.

language: rust

# GitHub-hosted runners — no ARC dependency for this test repo.
runners:
  default: ubuntu-latest

quality:
  enabled: true
  rust:
    features:
      - "default"

test:
  enabled: true
  coverage: false

build:
  enabled: true
  type: app
  strategies:
    - native
  rust:
    targets:
      - x86_64-unknown-linux-gnu
      - aarch64-unknown-linux-gnu

publish:
  # OFF. This is a TEST FIXTURE and `target: oss` means the real public
  # registries -- crates.io for a Rust repo. ci-test-rust-lib proved that is
  # not theoretical: it published 1.0.0 to crates.io on 2026-07-29 during a
  # routine fixture run, and crates.io has no delete. A yank stops new
  # dependency resolution finding it; the name and version stay forever.
  #
  # A fixture is a low-scrutiny repo by design, so an automatic path from it to
  # a public registry is the wrong shape regardless of what it happens to
  # contain today.
  #
  # The stages worth testing -- version resolution, tagging, artefact build --
  # all run before the upload and are still exercised. Only the upload is off.
  enabled: false
  # `target` drives all artefact routing. `oss` -> GHCR + public
  # registries; `internal` -> JFrog. The container job derives its
  # registry from target; no `registry:` field needed.
  target: oss
  binaries: both
  container:
    # Strict mode: fail loudly if the Dockerfile disappears.
    enabled: true
    dockerfile: Dockerfile
    platforms:
      - linux/amd64
      - linux/arm64
    # Branch-mode dev images (hyperi-ci branch-mode plan): opted-in PRs
    # push branch-<slug> + branch-<slug>-sha-<short> dev tags to GHCR
    # only. Pairs with the HYPERCI_BRANCH_BUILD repo variable and the
    # scheduled ghcr-prune.yml workflow. This fixture is the fleet
    # dev-push canary for the custom-Dockerfile (prebuilt binary)
    # container mode.
    dev_push: true
  helm:
    enabled: true
