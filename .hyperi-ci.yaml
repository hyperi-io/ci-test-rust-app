# HyperI CI Configuration — ci-test-rust-minimal
#
# Mirrors dfe-loader complexity (jfrog publish, container, helm, aarch64 cross)
# but with zero cargo dependencies so builds complete in <5 minutes.
# Use this project to iterate on CI scripts without 30-minute feedback loops.

language: rust

# Use standard GitHub runners (not ARC) — no runner infra dependency
runners:
  default: ubuntu-latest

quality:
  enabled: true
  rust:
    features:
      - "default"

test:
  enabled: true
  coverage: false    # No coverage tooling needed for minimal binary

build:
  enabled: true
  type: app
  strategies:
    - native
  rust:
    targets:
      - x86_64-unknown-linux-gnu
      - aarch64-unknown-linux-gnu

publish:
  enabled: true
  # `target` drives all artefact routing. `oss` -> GHCR + public
  # registries; `internal` -> JFrog Docker / JFrog repos. The container
  # job no longer takes a `registry:` field — it's derived from target.
  target: oss
  binaries: both
  container:
    # Strict mode: fail loudly if the Dockerfile / contract source
    # disappears. This is the canary for the new container pipeline,
    # so we want loud failure if signal detection regresses.
    enabled: true
    dockerfile: Dockerfile
    platforms:
      - linux/amd64
      - linux/arm64
  helm:
    enabled: true
