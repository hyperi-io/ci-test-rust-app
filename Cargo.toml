[package]
name = "ci-test-rust-app"
version = "1.0.0"
edition = "2021"
rust-version = "1.82"
license = "FSL-1.1-ALv2"
description = "Rust app variant — exercises hyperi-ci container custom mode (GHCR) + native deps"

# Two deps deliberately chosen to mirror real DFE projects:
#
#   rdkafka (dynamic-linking) — links against librdkafka-dev installed
#   from apt. Mirrors what dfe-loader actually does in production.
#   The cmake-build feature would compile librdkafka from C source on
#   every CI step (~3 min each, 4 steps per run); dynamic-linking
#   skips that entirely and validates the apt → link path that the
#   real DFE container build uses.
#
#   hyperi-rustlib — validates that the standard logger/cli surface
#   resolves at install time and that `DfeApp` is reachable when a
#   project later opts into contract-mode container builds. Real DFE
#   apps depend on it directly.
#
# Only this rust app carries the kafka native-dep surface — sibling
# repos (ci-test-rust-lib, ci-test-rust-workspace) stay rustlib-only
# to keep their CI fast and focused on their own test axis.
[dependencies]
rdkafka = { version = "0.39.0", features = ["dynamic-linking"] }
hyperi-rustlib = { version = ">=2.5.4", default-features = false, features = ["logger", "cli"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
opt-level = 3
