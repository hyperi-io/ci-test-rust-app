[package]
name = "ci-test-rust-app"
version = "1.0.0"
edition = "2021"
# Floor set by scalo, which is edition 2024 and declares rustc 1.95.
# The edition stays 2021 -- that is this fixture's own test axis.
rust-version = "1.95"
license = "FSL-1.1-ALv2"
description = "hyperi-ci E2E fixture: Rust app, container custom mode and native deps"

# Two deps deliberately chosen to mirror real DFE projects:
#
#   rdkafka (dynamic-linking) — links against librdkafka-dev installed
#   from apt. Mirrors what dfe-loader actually does in production.
#   The cmake-build feature would compile librdkafka from C source on
#   every CI step (~3 min each, 4 steps per run); dynamic-linking
#   skips that entirely and validates the apt → link path that the
#   real DFE container build uses.
#
#   scalo -- validates that the standard logger/cli surface resolves at
#   install time. Real DFE apps depend on it directly. `cli` is the bare
#   clap tier (CommonArgs, StandardCommand, VersionInfo, CliError);
#   ServiceApp needs `cli-service`, which pulls metrics + memory +
#   scaling + worker-pool and blows the sub-5-minute CI budget.
#   Supersedes hyperi-rustlib (repo archived 2026-08-03).
#
# Only this rust app carries the kafka native-dep surface -- sibling
# repos (ci-test-rust-lib, ci-test-rust-workspace) stay scalo-only
# to keep their CI fast and focused on their own test axis.
[dependencies]
rdkafka = { version = "0.39.0", features = ["dynamic-linking"] }
scalo = { version = ">=2.14.33, <3", default-features = false, features = ["logger", "cli"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
opt-level = 3
